# Renders the Galactic view at phone and tablet sizes (test/galactic_layout_test.dart) and uploads the pictures.
# Runs by hand or on pushes to galactic/* branches; publishes nothing.
name: Galactic Layout

on:
  workflow_dispatch:
  push:
    branches: ['galactic/**']

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Pakete laden
        working-directory: app
        run: flutter pub get

      - name: Galactic pruefen
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/galactic test/galactic_layout_test.dart

      - name: Bilder rendern
        working-directory: app
        run: flutter test --update-goldens test/galactic_layout_test.dart

      # Bilder in den Branch galactic-shots legen (zum Ansehen ohne Artefakt-Download)
      - name: Bilder ablegen
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp app/test/goldens/galactic_*.png /tmp/shots/ 2>/dev/null || true
          cp -r app/test/failures /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b galactic-shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Layout ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" galactic-shots
